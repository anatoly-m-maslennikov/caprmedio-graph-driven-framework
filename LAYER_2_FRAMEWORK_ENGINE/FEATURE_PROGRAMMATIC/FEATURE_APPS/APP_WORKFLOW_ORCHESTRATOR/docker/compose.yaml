# CA-M-504@2
# CA-M-322@13
x-runtime-logging: &runtime-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    mode: "non-blocking"
    max-buffer-size: "1m"

x-runtime: &runtime
  image: ${CAPRMEDIO_IMAGE:-caprmedio-runtime:local}
  logging: *runtime-logging
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 2

x-project-mounts: &project-mounts
  - type: bind
    source: ${CAPRMEDIO_PROJECT_ROOT}
    target: /project
    bind: {create_host_path: false}
  - type: bind
    source: ${CAPRMEDIO_PROJECT_ROOT}/.git
    target: /project/.git
    read_only: true
    bind: {create_host_path: false}

services:
  worker:
    <<: *runtime
    command: [worker]
    environment:
      CAPRMEDIO_RUNTIME_NAMESPACE: docker
    volumes: *project-mounts
    networks: [runtime]
    healthcheck:
      test: [CMD, python, LAYER_2_FRAMEWORK_ENGINE/FEATURE_PROGRAMMATIC/FEATURE_APPS/APP_WORKFLOW_ORCHESTRATOR/docker/entrypoint.py, health]
      interval: 2s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
  mcp:
    <<: *runtime
    command: [mcp]
    stdin_open: true
    profiles: [stdio]
    environment:
      CAPRMEDIO_RUNTIME_NAMESPACE: docker
      CAPRMEDIO_HOT_RELOAD: ${CAPRMEDIO_HOT_RELOAD:-0}
    volumes: *project-mounts
    networks: [runtime]

networks:
  runtime: {internal: true}
  egress: {}
