# CA-M-504@4
# CA-M-322@13
# CA-M-551@2
x-runtime-logging: &runtime-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    mode: "non-blocking"
    max-buffer-size: "1m"

x-runtime: &runtime
  image: ${CAPRMEDIO_IMAGE:-caprmedio-runtime:local}
  logging: *runtime-logging
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 2

x-project-mounts: &project-mounts
  - type: bind
    source: ${CAPRMEDIO_PROJECT_ROOT}
    target: /project
    bind: {create_host_path: false}
  - type: bind
    source: ${CAPRMEDIO_PROJECT_ROOT}/.git
    target: /project/.git
    read_only: true
    bind: {create_host_path: false}

services:
  mcp:
    <<: *runtime
    command: [mcp]
    stdin_open: true
    profiles: [stdio]
    environment:
      CAPRMEDIO_RUNTIME_NAMESPACE: docker
    volumes: *project-mounts
    networks: [runtime]

networks:
  runtime: {internal: true}
  egress: {}
